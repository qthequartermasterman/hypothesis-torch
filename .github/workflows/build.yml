---
name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  HYPOTHESIS_PROFILE: "ci"
  UV_SYSTEM_PYTHON: "true"

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
        # Test against every PyTorch minor release from the last two years, plus the latest release ('').
        torch-version: ['2.6.0', '2.7.1', '2.8.0', '2.9.1', '2.10.0', '2.11.0', '2.12.1', '2.13.0', '2.14.1', '2.15.0', '']
        exclude:
          # PyTorch only ships Python 3.14 wheels starting with 2.9.
          - python-version: '3.14'
            torch-version: '2.6.0'
          - python-version: '3.14'
            torch-version: '2.7.1'
          - python-version: '3.14'
            torch-version: '2.8.0'
          # PyTorch only ships Python 3.15 wheels starting with 2.15.
          - python-version: '3.15'
            torch-version: '2.6.0'
          - python-version: '3.15'
            torch-version: '2.7.1'
          - python-version: '3.15'
            torch-version: '2.8.0'
          - python-version: '3.15'
            torch-version: '2.9.1'
          - python-version: '3.15'
            torch-version: '2.10.0'
          - python-version: '3.15'
            torch-version: '2.11.0'
          - python-version: '3.15'
            torch-version: '2.12.1'
          - python-version: '3.15'
            torch-version: '2.13.0'
          - python-version: '3.15'
            torch-version: '2.14.1'
    uses: ./.github/workflows/build-reusable.yml
    with:
      python-version: ${{ matrix.python-version }}
      torch-version: ${{ matrix.torch-version }}
      lint: ${{ matrix.python-version == '3.12' }}
